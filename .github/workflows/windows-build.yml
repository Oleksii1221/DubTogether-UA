name: Windows development build
on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/audit_translations.py
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
      - run: python tools/build_windows.py
      - name: Smoke test packaged interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import pathlib, subprocess; shot=pathlib.Path('dist/installer-smoke.png'); subprocess.run(['dist/DubTogether-UA-Installer.exe', '--screenshot', str(shot)], check=True, timeout=30); assert shot.is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: DubTogether-UA-Windows-dev
          path: dist/DubTogether-UA-Installer.exe
          if-no-files-found: error
