name: Linux development build

on:
  push:
    branches: [linux_dev]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONPATH: src
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/audit_translations.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_linux.py
      - name: Smoke-test packaged installer
        run: |
          ./dist/DubTogether-UA-Installer-Linux-x86_64 --screenshot build/linux-preview.png
          test -s build/linux-preview.png
      - name: Write checksum
        run: |
          cd dist
          sha256sum DubTogether-UA-Installer-Linux-x86_64 > DubTogether-UA-Installer-Linux-x86_64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: DubTogether-UA-Linux-dev
          path: |
            dist/DubTogether-UA-Installer-Linux-x86_64
            dist/DubTogether-UA-Installer-Linux-x86_64.sha256
            build/linux-preview.png
          if-no-files-found: error
